seed: 42
ingest:
  sources:
    synthetic:
      n_per_class: 60
      n_patients_per_class: 20
      min_side: 48
      max_side: 96
      signal: 0.3
      n_exact_duplicates: 3
      n_label_conflicts: 1
      n_corrupt: 2
catalog:
  near_dup_max_hamming: 4
  near_dup_max_mad: 6.0
process:
  size: 64
  clahe:
    enabled: false
    clip_limit: 2.0
    tile_grid: 8
  workers: 1
features:
  workers: 1
  first_order_bins: 256
  haralick:
    distance: 1
    ignore_zeros: false
  zernike:
    radius: 32
    degree: 8
  lbp:
    points: 8
    radius: 3
    method: default
    bins: 10
split:
  test_size: 0.2
  val_size: 0.1
train_baseline:
  candidates: [logreg, random_forest, mlp]
  logreg:
    C: 1.0
    max_iter: 1000
  random_forest:
    n_estimators: 50
    max_depth: null
    n_jobs: -1
  mlp:
    hidden_layer_sizes: [100]
    alpha: 1.0e-4
    learning_rate_init: 0.01
    max_iter: 500
train_cnn:
  enabled: true
  arch: resnet18
  weights: none
  input_size: 64
  epochs: 1
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 1.0e-4
  patience: 3
  device: cpu
  num_workers: 0
  amp: false
evaluate:
  threshold: 0.5
