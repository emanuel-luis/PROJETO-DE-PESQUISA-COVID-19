[project]
name = "covidxr"
version = "0.1.0"
description = "Reproducible DVC pipeline for chest X-ray COVID-19 classification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Emanuel Luis", email = "emanuel.filho08@gmail.com" }]
dependencies = [
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow",
    "opencv-python-headless",
    "pyyaml",
    "kagglehub>=1.0.3,<2",
    "mahotas>=1.4.19",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
cnn = ["torch>=2.5", "torchvision>=0.20"]

[project.scripts]
covidxr = "covidxr.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "hypothesis",
    "ruff",
    "mypy",
    "pandas-stubs",
    "types-PyYAML",
    "dvc",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
extend-select = ["BLE"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -m 'not slow and not external and not gpu'"
markers = [
    "slow: end-to-end tests that run the whole pipeline",
    "external: tests that need network access or credentials",
    "gpu: tests that need a CUDA device",
]
timeout = 60
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "mahotas", "mahotas.*", "sklearn", "sklearn.*", "joblib"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["covidxr.features"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
