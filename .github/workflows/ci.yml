name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked
      - run: make lint

  test:
    name: test (unit + synthetic end to end)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked
      # external (network, Kaggle) and gpu tests stay deselected: CI never downloads real data
      - run: make test

  pipeline:
    name: pipeline (dvc repro on synthetic images)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked
      # the CI profile swaps the real sources for the synthetic one; same DAG, same commands
      - run: cp params.ci.yaml params.yaml
      - run: uv run dvc repro
      - name: Every stage output is complete
        run: |
          for d in data/raw/synthetic data/catalog; do
            test -f "$d/_run.json" || { echo "missing $d/_run.json"; exit 1; }
          done
      - run: uv run dvc status
