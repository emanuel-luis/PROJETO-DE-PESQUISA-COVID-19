name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked
      - run: make lint

  test:
    name: test (unit + synthetic end to end)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked --extra cnn  # Linux resolves the CPU torch wheels
      # external (network, Kaggle) and gpu tests stay deselected: CI never downloads real data
      - run: make test

  test-windows:
    name: test (windows, without the cnn extra)
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12", enable-cache: true }
      # no cnn extra: the cu130 torch wheels are ~3 GB; the CNN tests skip, the CNN stage is off
      - run: uv sync --locked
      # same selection as `make test` (make is not on the Windows runner)
      - run: uv run pytest -m "not external and not gpu"

  pipeline:
    name: pipeline (dvc repro on synthetic images)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked --extra cnn
      # the CI profile swaps the real sources for the synthetic one; same DAG, same commands
      - run: cp params.ci.yaml params.yaml
      - run: uv run dvc repro
      - name: Every stage output is complete
        run: |
          for d in data/raw/synthetic data/catalog data/processed data/features \
            data/splits models/baseline models/cnn data/eval; do
            test -f "$d/_run.json" || { echo "missing $d/_run.json"; exit 1; }
          done
          test -f reports/quality.json
          test -f reports/metrics.json
      - run: uv run dvc status
