stages:
  ingest:
    foreach: ${ingest.sources}
    do:
      cmd: covidxr ingest --source ${key}
      deps:
        - src/covidxr/sources
        - src/covidxr/ingest.py
      params:
        - seed
        - ingest.sources.${key}
      outs:
        - data/raw/${key}
  catalog:
    cmd: covidxr catalog
    deps:
      - data/raw
      - src/covidxr/sources
      - src/covidxr/catalog.py
      - src/covidxr/imaging.py
      - src/covidxr/contracts.py
    params:
      - ingest
      - catalog
    outs:
      - data/catalog
  process:
    cmd: covidxr process
    deps:
      - data/raw
      - data/catalog
      - src/covidxr/process.py
      - src/covidxr/imaging.py
      - src/covidxr/parallel.py
      - src/covidxr/contracts.py
    # workers is left out: it never changes the output
    params:
      - process.size
      - process.clahe
    outs:
      - data/processed
    metrics:
      - reports/quality.json:
          cache: false
  features:
    cmd: covidxr features
    deps:
      - data/processed
      - src/covidxr/features.py
      - src/covidxr/imaging.py
      - src/covidxr/parallel.py
      - src/covidxr/contracts.py
    params:
      - features.first_order_bins
      - features.haralick
      - features.zernike
      - features.lbp
    outs:
      - data/features
  split:
    cmd: covidxr split
    deps:
      - data/catalog
      - data/features
      - src/covidxr/split.py
      - src/covidxr/contracts.py
    params:
      - seed
      - split
    outs:
      - data/splits
  train_baseline:
    cmd: covidxr train-baseline
    deps:
      - data/features
      - data/splits
      - src/covidxr/training/baseline.py
      - src/covidxr/features.py
      - src/covidxr/contracts.py
    # n_jobs is left out: it never changes the fitted model
    params:
      - seed
      - features
      - train_baseline.candidates
      - train_baseline.logreg
      - train_baseline.random_forest.n_estimators
      - train_baseline.random_forest.max_depth
      - train_baseline.mlp
    outs:
      - models/baseline
  evaluate:
    cmd: covidxr evaluate
    deps:
      - data/splits
      - models/baseline
      - src/covidxr/evaluate.py
      - src/covidxr/contracts.py
    params:
      - evaluate
    outs:
      - data/eval
    metrics:
      - reports/metrics.json:
          cache: false
