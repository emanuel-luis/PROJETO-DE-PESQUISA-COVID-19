stages:
  ingest:
    foreach: ${ingest.sources}
    do:
      cmd: covidxr ingest --source ${key}
      deps:
        - src/covidxr/sources
        - src/covidxr/ingest.py
      params:
        - seed
        - ingest.sources.${key}
      outs:
        - data/raw/${key}
  catalog:
    cmd: covidxr catalog
    deps:
      - data/raw
      - src/covidxr/sources
      - src/covidxr/catalog.py
      - src/covidxr/imaging.py
    params:
      - ingest
      - catalog
    outs:
      - data/catalog
  process:
    cmd: covidxr process
    deps:
      - data/raw
      - data/catalog
      - src/covidxr/process.py
      - src/covidxr/imaging.py
    params:
      - process
    outs:
      - data/processed
    metrics:
      - reports/quality.json:
          cache: false
  features:
    cmd: covidxr features
    deps:
      - data/processed
      - src/covidxr/features.py
    params:
      - features
    outs:
      - data/features
