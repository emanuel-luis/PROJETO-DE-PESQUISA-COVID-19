stages:
  ingest:
    foreach: ${ingest.sources}
    do:
      cmd: covidxr ingest --source ${key}
      deps:
        - src/covidxr/sources
        - src/covidxr/ingest.py
      params:
        - seed
        - ingest.sources.${key}
      outs:
        - data/raw/${key}
  catalog:
    cmd: covidxr catalog
    deps:
      - data/raw
      - src/covidxr/sources
      - src/covidxr/catalog.py
      - src/covidxr/imaging.py
    params:
      - ingest
      - catalog
    outs:
      - data/catalog
