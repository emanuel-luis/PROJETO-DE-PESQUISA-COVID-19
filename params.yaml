seed: 42
ingest:
  sources:
    ieee8023:
      repo: ieee8023/covid-chestxray-dataset
      ref: 78543292f8b01d5e0ed1d0e15dce71949f0657bb
      views: [AP, AP Supine]
    kaggle_radiography:
      handle: tawsifurrahman/covid19-radiography-database
      version: 5
    kaggle_covidqu:
      handle: anasmohammedtahir/covidqu
      version: 7
catalog:
  near_dup_max_hamming: 4
process:
  size: 256
  clahe:
    enabled: false
    clip_limit: 2.0
    tile_grid: 8
  workers: 4
features:
  workers: 4
  first_order_bins: 256
  haralick:
    distance: 1
    ignore_zeros: false
  zernike:
    radius: 128
    degree: 8
  lbp:
    points: 8
    radius: 3
    method: default
    bins: 10
split:
  test_size: 0.2
  val_size: 0.1
train_baseline:
  candidates: [logreg, random_forest, mlp]
  logreg:
    C: 1.0
    max_iter: 1000
  random_forest:
    n_estimators: 300
    max_depth: null
    n_jobs: -1
  mlp:
    hidden_layer_sizes: [100]
    alpha: 1.0e-4
    learning_rate_init: 0.01
    max_iter: 500
train_cnn:
  enabled: true
  arch: resnet18
  weights: imagenet
  input_size: 224
  epochs: 10
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 1.0e-4
  patience: 3
  device: auto
  num_workers: 0
  amp: true
evaluate:
  threshold: 0.5
